<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UAV飛行計画 混雑・空域マップ | MLIT-LINKS</title>
  <meta name="description" content="MapLibre GL JS と地理院地図を用いた、無人航空機（UAV/ドローン）飛行計画の混雑・空域可視化マップ。国土交通省 Project LINKS のオープンデータを活用。" />

  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- タイトル / 説明パネル -->
  <header id="panel-title" class="panel">
    <h1 data-i18n="app.title">UAV飛行計画 混雑・空域マップ</h1>
    <p class="subtitle" data-i18n="app.subtitle">MLIT-LINKS 次世代航空モビリティ</p>
    <p class="note" data-i18n-html="app.note"></p>
    <p class="source" data-i18n="app.source"></p>
  </header>

  <!-- コントロールパネル -->
  <section id="panel-control" class="panel">
    <div class="control-group">
      <span class="control-label" data-i18n="label.lang">言語</span>
      <div class="seg" id="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="ja" class="active">日本語</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </div>

    <div class="control-group">
      <span class="control-label" data-i18n="label.basemap">背景地図</span>
      <div class="seg" id="basemap-switch" role="group" aria-label="Base map">
        <button type="button" data-basemap="std" class="active" data-i18n="basemap.std">標準</button>
        <button type="button" data-basemap="pale" data-i18n="basemap.pale">淡色</button>
        <button type="button" data-basemap="photo" data-i18n="basemap.photo">衛星</button>
      </div>
    </div>

    <div class="control-group">
      <span class="control-label" data-i18n="label.measure">表示する指標</span>
      <select id="measure-group">
        <option value="total" data-i18n="measure.total" selected>総数（全期間）</option>
        <option value="month" data-i18n="measure.month">月別</option>
        <option value="airspace" data-i18n="measure.airspace">飛行空域 区分別</option>
        <option value="method" data-i18n="measure.method">飛行方法別</option>
        <option value="purpose" data-i18n="measure.purpose">飛行目的（用途）別</option>
      </select>
      <select id="measure-value" disabled></select>
    </div>

    <div class="control-group">
      <span class="control-label" data-i18n="label.mesh">メッシュ解像度</span>
      <select id="mesh-size">
        <option value="2" data-i18n="mesh.fine">細かい（2km）</option>
        <option value="5" data-i18n="mesh.std" selected>標準（5km）</option>
        <option value="10" data-i18n="mesh.coarse">粗い（10km）</option>
      </select>
    </div>

    <div class="control-group">
      <span class="control-label" data-i18n="label.layers">表示レイヤー</span>
      <label class="toggle"><input type="checkbox" id="toggle-mesh" checked /> <span data-i18n="toggle.mesh">混雑メッシュ</span></label>
      <label class="toggle"><input type="checkbox" id="toggle-heatmap" /> <span data-i18n="toggle.heatmap">ヒートマップ</span></label>
    </div>

    <div class="control-group stats">
      <span class="control-label" data-i18n="label.stats">統計</span>
      <div id="stats-content"></div>
    </div>
  </section>

  <!-- 凡例 -->
  <section id="panel-legend" class="panel">
    <span class="control-label" data-i18n="label.legend">混雑度（件数 / メッシュ）</span>
    <div id="legend-bar"></div>
  </section>

  <script src="js/config.js"></script>
  <script src="js/map.js"></script>
</body>
</html>
